name: Deploy Quartz4

on:
  push:
    branches: [v4]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Remote Directory Before Copy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          script: |
            echo "正在清理远程目录..."
            rmdir /s /q "D:\Service\DockerCompose\quartz4\remote-code" 2>nul || true
            mkdir "D:\Service\DockerCompose\quartz4\remote-code"
            echo "远程目录清理完成。"

      - name: Copy files to Windows
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          source: "quartz,quartz.config.ts,quartz.layout.ts"
          target: "D:/Service/DockerCompose/quartz4/remote-code/"
          overwrite: false
          rm: false

      - name: Execute in WSL and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          script: |
            
            $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
            Write-Host "备份时间戳: $timestamp"
            
            # WSL操作
            wsl -d Ubuntu echo "1. 备份原文件..."
            wsl -d Ubuntu mkdir -p "/mnt/d/Service/DockerCompose/backups/$timestamp"
            wsl -d Ubuntu cp -rf /mnt/d/Service/DockerCompose/quartz /mnt/d/Service/DockerCompose/quartz.config.ts /mnt/d/Service/DockerCompose/quartz.layout.ts "/mnt/d/Service/DockerCompose/backups/$timestamp/" 2>/dev/null || true
            
            wsl -d Ubuntu echo "2. 删除原文件..."
            wsl -d Ubuntu rm -rf /mnt/d/Service/DockerCompose/quartz /mnt/d/Service/DockerCompose/quartz.config.ts /mnt/d/Service/DockerCompose/quartz.layout.ts
            
            wsl -d Ubuntu echo "3. 复制新文件从Windows目录..."
            # 先检查文件是否已传输到位
            wsl -d Ubuntu ls -la "/mnt/d/Service/DockerCompose/quartz4/remote-code/"
            wsl -d Ubuntu cp -r "/mnt/d/Service/DockerCompose/quartz4/remote-code/quartz" /mnt/d/Service/DockerCompose/
            wsl -d Ubuntu cp "/mnt/d/Service/DockerCompose/quartz4/remote-code/quartz.config.ts" /mnt/d/Service/DockerCompose/
            wsl -d Ubuntu cp "/mnt/d/Service/DockerCompose/quartz4/remote-code/quartz.layout.ts" /mnt/d/Service/DockerCompose/
            
            wsl -d Ubuntu echo "4. 重启Docker容器..."
            wsl -d Ubuntu docker restart quartz4
            
            wsl -d Ubuntu echo "5. 验证部署..."
            wsl -d Ubuntu sleep 3
            wsl -d Ubuntu docker ps --filter name=quartz4 --format "table {{.Names}}\t{{.Status}}"
            
            wsl -d Ubuntu echo "✅ 部署完成！"