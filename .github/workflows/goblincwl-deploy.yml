name: Deploy Quartz4

on:
  push:
    branches: [v4]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Remote Directory Before Copy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          script: |
            wsl -d Ubuntu rm -rf /mnt/d/Service/DockerCompose/quartz4/remote-code
            mkdir "D:\Service\DockerCompose\quartz4\remote-code"

      - name: Copy files to Windows
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          source: "quartz,quartz.config.ts,quartz.layout.ts"
          target: "D:/Service/DockerCompose/quartz4/remote-code/"
          overwrite: false
          rm: false

      - name: Execute in WSL and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          script: |
            wsl -d Ubuntu rm -rf /mnt/d/Service/DockerCompose/quartz4/quartz
            wsl -d Ubuntu rm -rf /mnt/d/Service/DockerCompose/quartz4/quartz.config.ts
            wsl -d Ubuntu rm -rf /mnt/d/Service/DockerCompose/quartz4/quartz.layout.ts
            wsl -d Ubuntu mkdir /mnt/d/Service/DockerCompose/quartz4/quartz
            xcopy "D:\Service\DockerCompose\quartz4\remote-code\quartz" "D:\Service\DockerCompose\quartz4\quartz\" /E /I /Y
            copy /Y "D:\Service\DockerCompose\quartz4\remote-code\quartz.config.ts" "D:\Service\DockerCompose\quartz4\"
            copy /Y "D:\Service\DockerCompose\quartz4\remote-code\quartz.layout.ts" "D:\Service\DockerCompose\quartz4\"
            wsl -d Ubuntu docker restart quartz4
            wsl -d Ubuntu sleep 3
            wsl -d Ubuntu docker ps --filter name=quartz4 --format "table {{.Names}}\t{{.Status}}"
            Write-Host "✅ 部署完成！"