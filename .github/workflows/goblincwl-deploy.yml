name: Deploy Quartz4

on:
  push:
    branches: [v4]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Remote Directory Before Copy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          script: |
            echo "正在清理远程目录..."
            rmdir /s /q "D:\Service\DockerCompose\quartz4\remote-code" 2>nul || true
            mkdir "D:\Service\DockerCompose\quartz4\remote-code"
            echo "远程目录清理完成。"

      - name: Copy files to Windows
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          source: "quartz,quartz.config.ts,quartz.layout.ts"
          target: "D:/Service/DockerCompose/quartz4/remote-code/"
          overwrite: false
          rm: false

      - name: Execute in WSL and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          script: |
           wsl -d Ubuntu bash -c "
           cd /mnt/d/Service/DockerCompose/ && \
           echo '备份...' && \
           mkdir -p backups/\$(date +%Y%m%d_%H%M%S) && \
           cp -rf quartz quartz.config.ts quartz.layout.ts backups/\$(date +%Y%m%d_%H%M%S)/ 2>/dev/null || true && \
           echo '删除旧文件...' && \
           rm -rf quartz quartz.config.ts quartz.layout.ts && \
           echo '复制新文件...' && \
           ls -la /mnt/d/Service/DockerCompose/quartz4/remote-code/ && \
           cp -r /mnt/d/Service/DockerCompose/quartz4/remote-code/quartz . && \
           cp /mnt/d/Service/DockerCompose/quartz4/remote-code/quartz.config.ts . && \
           cp /mnt/d/Service/DockerCompose/quartz4/remote-code/quartz.layout.ts . && \
           echo '重启容器...' && \
           docker restart quartz4 && \
           sleep 3 && \
           docker ps --filter name=quartz4 && \
           echo '✅ 完成'
           "