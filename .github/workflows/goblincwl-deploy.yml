name: Deploy Quartz4

on:
  push:
    branches: [v4]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Clean Remote Directory Before Copy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          script: |
            powershell -Command "if (Test-Path 'D:\Service\DockerCompose\quartz4\quartz') { Remove-Item -Recurse -Force 'D:\Service\DockerCompose\quartz4\quartz' }"
      - name: Copy files to Windows
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          source: "quartz,quartz.config.ts,quartz.layout.ts"
          target: "D:/Service/DockerCompose/quartz4/"
          overwrite: false
          rm: false

      - name: Execute in WSL and Restart
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          script: |
            wsl -d Ubuntu docker restart quartz4
            wsl -d Ubuntu sleep 3
            wsl -d Ubuntu docker ps --filter name=quartz4 --format "table {{.Names}}\t{{.Status}}"
            Write-Host "✅ 部署完成！"