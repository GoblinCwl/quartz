name: Deploy Quartz4

on:
  push:
    branches: [v4]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Remote Directory Before Copy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          script: |
            echo "正在清理远程目录..."
            rmdir /s /q "D:\Service\DockerCompose\quartz4\remote-code" 2>nul || true
            mkdir "D:\Service\DockerCompose\quartz4\remote-code"
            echo "远程目录清理完成。"

      - name: Copy files to Windows
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          source: "quartz,quartz.config.ts,quartz.layout.ts"
          target: "D:/Service/DockerCompose/quartz4/remote-code/"
          overwrite: false
          rm: false

      - name: Execute in WSL and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WINDOWS_HOST }}
          username: ${{ secrets.WINDOWS_USER }}
          password: ${{ secrets.WINDOWS_PASSWORD }}
          port: ${{ secrets.WINDOWS_PORT }}
          script: |
            
            powershell -Command "
            # 1. 生成时间戳并备份
            `$timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'
            `$backupDir = 'D:\Service\DockerCompose\backups\' + `$timestamp
            New-Item -ItemType Directory -Path `$backupDir -Force | Out-Null
            Copy-Item 'D:\Service\DockerCompose\quartz' `$backupDir -Recurse -ErrorAction SilentlyContinue
            Copy-Item 'D:\Service\DockerCompose\quartz.config.ts' `$backupDir -ErrorAction SilentlyContinue
            Copy-Item 'D:\Service\DockerCompose\quartz.layout.ts' `$backupDir -ErrorAction SilentlyContinue
            Write-Host '[PowerShell] 备份完成到: ' `$backupDir"
            
            Remove-Item "D:\Service\DockerCompose\quartz" -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item "D:\Service\DockerCompose\quartz.config.ts" -Force -ErrorAction SilentlyContinue
            Remove-Item "D:\Service\DockerCompose\quartz.layout.ts" -Force -ErrorAction SilentlyContinue
            
            Copy-Item "D:\Service\DockerCompose\quartz4\remote-code\quartz" "D:\Service\DockerCompose\" -Recurse -Force
            Copy-Item "D:\Service\DockerCompose\quartz4\remote-code\quartz.config.ts" "D:\Service\DockerCompose\" -Force
            Copy-Item "D:\Service\DockerCompose\quartz4\remote-code\quartz.layout.ts" "D:\Service\DockerCompose\" -Force
            Write-Host "文件复制完成"
            
            wsl -d Ubuntu docker restart quartz4
            
            wsl -d Ubuntu sleep 3
            wsl -d Ubuntu docker ps --filter name=quartz4 --format "table {{.Names}}\t{{.Status}}"
            
            Write-Host "✅ 部署完成！"